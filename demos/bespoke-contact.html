<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bespoke Sync | Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,800;1,400;1,800&family=Inter:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.12); }
        body { font-family: 'Inter', sans-serif; background: #050508; color: #fff; overflow-x: hidden; opacity: 0; }
        .serif { font-family: 'EB Garamond', serif; }
        
        /* Ultra Glass Backdrop with Native Mobile Gradients */
        .glass-background { position: fixed; inset: 0; z-index: -1; background: url('../ultra_premium_glassmorphism_texture_1778799423352.png'); background-size: cover; background-position: center; filter: brightness(0.6) contrast(1.1); scale: 1.1; height: 100dvh; }
        .glass-background::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.3) 0%, transparent 50%), radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.3) 0%, transparent 50%); pointer-events: none; }
        
        .ultra-glass { background: var(--glass); backdrop-filter: blur(50px); border: 1px solid var(--border); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255,255,255,0.05); border-radius: 40px; transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        
        input, textarea { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); padding: 1.5rem; width: 100%; border-radius: 20px; color: #fff; outline: none; transition: all 0.3s ease; }
        input:focus, textarea:focus { border-color: #fff; background: rgba(255, 255, 255, 0.05); }
        
        .btn-luxury { padding: 1.5rem 3rem; background: #fff; color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: 0.4em; font-size: 0.7rem; border-radius: 100px; width: 100%; transition: all 0.4s ease; }
        .btn-luxury:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(255,255,255,0.3); }
        
        .text-mask { -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-image: linear-gradient(90deg, #fff, rgba(255,255,255,0.5)); }
    </style>
</head>
<body class="antialiased">
    <div class="glass-background"></div>

    <nav class="fixed top-8 left-1/2 -translate-x-1/2 w-[90%] max-w-6xl z-[100] ultra-glass px-10 py-5 flex justify-between items-center">
        <div class="serif italic text-2xl font-black tracking-tighter">Bespoke Studio</div>
        <div class="hidden md:flex space-x-12 text-[10px] uppercase font-bold tracking-[0.3em] opacity-60">
            <a href="bespoke.html">Acasă</a>
            <a href="bespoke-services.html">Experiențe</a>
            <a href="bespoke-contact.html" class="text-white opacity-100">Contact</a>
        </div>
        <div class="w-10 h-10 rounded-full border border-white/20 flex items-center justify-center text-[10px] font-black">BS</div>
    </nav>

    <main class="min-h-screen flex items-center justify-center pt-48 pb-20 px-6">
        <div class="max-w-7xl w-full grid lg:grid-cols-2 gap-32 items-center">
            <div>
                <div class="text-[10px] uppercase font-bold tracking-[0.8em] opacity-40 mb-8 italic">Initiating Sync</div>
                <h1 class="text-6xl md:text-8xl serif italic font-black text-white text-mask mb-12">Contact.</h1>
                <p class="text-xl md:text-2xl font-light opacity-50 mb-20 italic">Suntem pregătiți să dăm viață ideilor tale prin precizie și artă digitală.</p>
                
                <div class="space-y-10 opacity-60 text-[11px] font-bold uppercase tracking-widest">
                    <p>office@devd.ro</p>
                    <p>Bucharest // RO</p>
                </div>
            </div>

            <div class="ultra-glass p-10 md:p-16 relative overflow-hidden">
                <div class="absolute inset-0 bg-gradient-to-tr from-violet-500/5 to-transparent pointer-events-none"></div>
                <form class="space-y-8 relative z-10">
                    <div class="space-y-3">
                        <label class="text-[9px] uppercase font-bold tracking-widest opacity-40">Identitate</label>
                        <input type="text" placeholder="Nume Complet" required>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[9px] uppercase font-bold tracking-widest opacity-40">Conexiune</label>
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="space-y-3">
                        <label class="text-[9px] uppercase font-bold tracking-widest opacity-40">Viziune</label>
                        <textarea rows="4" placeholder="Detalii Proiect..." required></textarea>
                    </div>
                    <button class="btn-luxury">Trimite Datele</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        gsap.to("body", { opacity: 1, duration: 1.5, ease: "power2.inOut" });
    </script>
</body>
</html>
